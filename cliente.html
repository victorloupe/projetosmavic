<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAVIC — Meus Projetos</title>
<link rel="icon" type="image/x-icon" href="icon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cliente.css?v=25">
<!-- supabase-js e config.js removidos: o cliente não acessa o banco diretamente.
     Os dados chegam via Edge Function com autenticação server-side. -->
</head>
<body>

<div class="loading" id="loading">
  <div class="spin"></div>
  <div style="font-weight:600;font-size:14px">Carregando projetos…</div>
  <div id="loadingText" style="font-size:12px;color:var(--text3)">Conectando ao MAVIC</div>
</div>

<div id="errorScreen" class="error-screen d-none">
  <i id="errIcon" class="bi bi-exclamation-triangle"></i>
  <h5 id="errTitle" style="font-weight:700;font-size:18px"></h5>
  <p id="errMsg" style="font-size:13px;max-width:360px"></p>
</div>

<nav class="nav">
  <div class="nav-brand">
    <img id="navLogo" src="LOGO NOVA.png" alt="MAVIC" class="nav-logo" onerror="this.style.display='none'">
    <div>
      <div class="nav-name">MAVIC Projetos</div>
      <div class="nav-sub"><i class="bi bi-person-check" style="color:var(--accent)"></i> <strong id="clientLabel">—</strong></div>
    </div>
  </div>
  <div class="nav-sep"></div>
  <div class="fin-bar">
    <div class="fin-item" id="finItemPago" onclick="showFinModal('pago')">
      <div class="fin-lbl"><i class="bi bi-cash-stack"></i> Pagos</div>
      <div class="fin-val pago" id="totalPago">R$ 0,00</div>
    </div>
    <div class="fin-sep"></div>
    <div class="fin-item" id="finItemRest" onclick="showFinModal('rest')">
      <div class="fin-lbl"><i class="bi bi-exclamation-circle"></i> A Pagar</div>
      <div class="fin-val rest" id="totalRest">R$ 0,00</div>
    </div>
  </div>
  <div class="nav-spacer"></div>
  <div class="nav-search"><i class="bi bi-search"></i><input id="srch" placeholder="Buscar projeto…" oninput="renderBoard()"></div>
  <div class="nav-sep"></div>
  <div class="nav-actions">
    <button class="btn-icon" onclick="loadData()" title="Atualizar"><i class="bi bi-arrow-clockwise" id="refreshIcon"></i></button>
    <button class="btn-icon" id="themeBtn" onclick="toggleTheme()" title="Tema"><i class="bi bi-moon-stars"></i></button>
  </div>
</nav>

<!-- FIN BAR MOBILE -->
<div class="fin-bar-mobile">
  <div class="fin-item" id="finItemPagoM" onclick="showFinModal('pago')">
    <div class="fin-lbl"><i class="bi bi-cash-stack"></i> Pagos</div>
    <div class="fin-val pago" id="totalPagoM">R$ 0,00</div>
  </div>
  <div class="fin-sep"></div>
  <div class="fin-item" id="finItemRestM" onclick="showFinModal('rest')">
    <div class="fin-lbl"><i class="bi bi-exclamation-circle"></i> A Pagar</div>
    <div class="fin-val rest" id="totalRestM">R$ 0,00</div>
  </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <select class="inp btn-sm" id="fType" onchange="renderBoard()" style="width:auto">
    <option value="">Todos os Tipos</option>
  </select>
  <div style="flex:1"></div>
  <span id="boardCount" style="font-size:12px;color:var(--text3)"></span>
</div>

<!-- NOTIFICATIONS -->
<div class="notif-wrap d-none" id="notifWrap">
  <div class="notif-banner" id="notifBanner"></div>
</div>

<!-- BOARD VIEW -->
<div class="board-view" id="boardView">
  <div class="board-outer"><div class="board" id="board"></div></div>
</div>
<div class="toast-wrap" id="toastWrap"></div>
<!-- FINANCIAL MODAL -->
<div id="finModal" class="modal-overlay d-none" onclick="closeFinModal()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h5 id="finModalTitle" style="margin:0;font-weight:700;font-size:16px">Resumo Financeiro</h5>
      <button class="btn-icon" onclick="closeFinModal()" title="Fechar"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body" id="finModalBody" style="display:flex;flex-direction:column;gap:12px">
      <!-- Carregado dinamicamente -->
    </div>
  </div>
</div>
<!-- CONFIRM MODAL (substitui o confirm() nativo do navegador) -->
<div id="confirmOverlay" class="modal-overlay d-none" onclick="closeConfirm()">
  <div class="modal-card" style="max-width:380px" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h5 id="confirmTitle" style="margin:0;font-weight:700;font-size:15px"><i class="bi bi-question-circle"></i> Confirmar ação</h5>
    </div>
    <div class="modal-body">
      <p id="confirmMsg" style="font-size:13.5px;color:var(--text2);line-height:1.5;margin:0 0 14px"></p>
      <div style="display:flex;justify-content:flex-end;gap:7px">
        <button class="btn btn-ghost" onclick="closeConfirm()">Cancelar</button>
        <button class="btn" id="confirmBtnOk" style="background:var(--red-bg);border:1px solid var(--red);color:var(--red);font-weight:600">Confirmar</button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="cliente.js?v=28"></script>
</body>
</html>
