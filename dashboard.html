<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function(){
  try {
    var t = localStorage.getItem('mavic_theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.style.colorScheme = t;
  } catch(e){}
  try {
    var raw = localStorage.getItem('mavic_admin_session') || sessionStorage.getItem('mavic_admin_session');
    if (!raw) { window.location.replace('login.html?redirect=' + encodeURIComponent(window.location.pathname.split('/').pop() || 'index.html')); return; }
    var s = JSON.parse(raw);
    if (!s || !s.expiresAt || s.expiresAt <= Date.now()) {
      localStorage.removeItem('mavic_admin_session');
      sessionStorage.removeItem('mavic_admin_session');
      window.location.replace('login.html?redirect=' + encodeURIComponent(window.location.pathname.split('/').pop() || 'index.html'));
    }
  } catch(e){}
})();
</script>
<title>MAVIC Projetos - Dashboard</title>
<link rel="icon" type="image/x-icon" href="icon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#92623a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css?v=131">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body class="preload">

<!-- DASHBOARD VIEW -->
<div class="dash-view on" id="dashboardView">
  <div class="dash-header-wrap" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px">
    <h4 style="font-weight:700;color:var(--accent);margin:0">Faturamento & Dashboard</h4>
    <div style="display:flex;align-items:center;gap:8px">
      <select class="inp inp-sm" id="dashPeriodSelect" onchange="renderDashboard()" style="width:auto;min-width:145px;font-weight:600">
        <option value="all" selected>Todo o Período</option>
        <option value="year">Este Ano</option>
        <option value="month">Este Mês</option>
      </select>
      <button class="btn btn-excel btn-sm" onclick="exportFullFinancialExcel()"><i class="bi bi-file-earmark-excel"></i> Exportar Excel</button>
    </div>
  </div>
  
  <div class="dash-grid" id="dashCards"></div>
  
  <div class="dash-sections-grid">
    <div class="dash-section-box">
      <div class="dash-section-header">
        <div class="dash-section-title"><i class="bi bi-alarm" style="color:var(--yellow)"></i> Prazos Críticos e Atrasados</div>
        <span class="badge" id="badgeCriticalCount">0</span>
      </div>
      <div class="dash-table-scroll" id="criticalTable"></div>
    </div>

    <div class="dash-section-box">
      <div class="dash-section-header">
        <div class="dash-section-title"><i class="bi bi-hourglass-split" style="color:var(--red)"></i> Projetos com Saldo Pendente</div>
        <span class="badge" id="badgePendingCount">0</span>
      </div>
      <div class="dash-table-scroll" id="dashTable"></div>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="common.js?v=145"></script>
<script src="dashboard.js?v=115"></script>
</body>
</html>
