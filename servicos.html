<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>
  (function(){
    try {
      var t = localStorage.getItem('mavic_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
    } catch(e){}
    try {
      var raw = localStorage.getItem('mavic_admin_session') || sessionStorage.getItem('mavic_admin_session');
      if (!raw) { window.location.replace('login.html?redirect=' + encodeURIComponent(window.location.pathname.split('/').pop() || 'index.html')); return; }
      var s = JSON.parse(raw);
      if (!s || !s.expiresAt || s.expiresAt <= Date.now()) {
        localStorage.removeItem('mavic_admin_session');
        sessionStorage.removeItem('mavic_admin_session');
        window.location.replace('login.html?redirect=' + encodeURIComponent(window.location.pathname.split('/').pop() || 'index.html'));
      }
    } catch(e){}
  })();
  </script>
  <title>MAVIC — Serviços</title>
  <link rel="icon" type="image/x-icon" href="icon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#92623a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="index.css?v=131">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
</head>
<body class="preload">

<!-- SERVIÇOS VIEW -->
<div class="dash-view on" id="servicosView">
  <div class="dash-header-wrap" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px">
    <h4 style="font-weight:700;color:var(--accent);margin:0">Serviços</h4>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn btn-ghost btn-sm" onclick="syncClientServicesManual()" title="Sincronizar dos Clientes" style="padding:6px 10px;display:inline-flex;align-items:center;justify-content:center"><i class="bi bi-arrow-repeat" style="font-size:15px"></i></button>
      <button class="btn btn-primary btn-sm" onclick="openServiceModal()" style="white-space:nowrap"><i class="bi bi-plus-lg"></i> Novo Serviço</button>
    </div>
  </div>
  
  <!-- KPI Cards Summary -->
  <div class="serv-kpi-grid">
    <div class="serv-kpi-card">
      <div class="serv-kpi-icon icon-total"><i class="bi bi-box-seam"></i></div>
      <div class="serv-kpi-content">
        <div class="serv-kpi-lbl">Total Serviços</div>
        <div class="serv-kpi-val" id="kpiTotalServicos">0</div>
      </div>
    </div>
    <div class="serv-kpi-card">
      <div class="serv-kpi-icon icon-gerais"><i class="bi bi-globe"></i></div>
      <div class="serv-kpi-content">
        <div class="serv-kpi-lbl">Serviços Gerais</div>
        <div class="serv-kpi-val text-green" id="kpiServicosGerais">0</div>
      </div>
    </div>
    <div class="serv-kpi-card">
      <div class="serv-kpi-icon icon-espec"><i class="bi bi-person-check"></i></div>
      <div class="serv-kpi-content">
        <div class="serv-kpi-lbl">P/ Cliente</div>
        <div class="serv-kpi-val text-blue" id="kpiServicosEspecificos">0</div>
      </div>
    </div>
    <div class="serv-kpi-card">
      <div class="serv-kpi-icon icon-preco"><i class="bi bi-tag"></i></div>
      <div class="serv-kpi-content">
        <div class="serv-kpi-lbl">Média Preço</div>
        <div class="serv-kpi-val text-accent" id="kpiMediaPreco">R$ 0,00</div>
      </div>
    </div>
  </div>

  <div class="toolbar serv-toolbar" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <div class="toolbar-filters serv-filters-grid" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:280px">
      <input type="text" class="inp inp-sm" id="fServSearch" placeholder="Buscar serviço ou escopo…" oninput="pgReset('servicos');renderServicos()" style="max-width:180px">
      <select class="inp inp-sm" id="fServCategory" onchange="pgReset('servicos');renderServicos()" style="width:auto">
        <option value="">Todas Categorias</option>
      </select>
      <select class="inp inp-sm" id="fServClient" onchange="pgReset('servicos');renderServicos()" style="width:auto">
        <option value="">Todos Clientes</option>
      </select>
      <input type="hidden" id="fServTarget" value="">
    </div>
    <div class="serv-chips-bar" id="servChipsBar" style="margin-bottom:0"></div>
  </div>

  <!-- Tabela Desktop -->
  <div class="dash-table serv-desktop-table">
    <table style="width:100%;border-collapse:collapse;font-size:13px;text-align:left">
      <thead>
        <tr style="background:var(--surface2);border-bottom:1px solid var(--border);color:var(--text3);font-size:11px;text-transform:uppercase;letter-spacing:0.5px">
          <th style="padding:10px 14px">Serviço / Detalhes</th>
          <th style="padding:10px 14px">Categoria</th>
          <th style="padding:10px 14px">Preço Padrão</th>
          <th style="padding:10px 14px">Disponibilidade / Clientes</th>
          <th style="padding:10px 14px;text-align:right">Ações</th>
        </tr>
      </thead>
      <tbody id="servTableBody"></tbody>
    </table>
  </div>

  <!-- Lista Mobile (Cards Compactos) -->
  <div class="serv-mobile-list" id="servMobileList"></div>

  <!-- Paginação -->
  <div id="servPagination"></div>
</div>

<!-- ══ MODAL DE CADASTRO / EDIÇÃO DE SERVIÇO ══ -->
<div class="overlay" id="serviceOverlay" onclick="if(event.target===this)closeServiceModal()">
  <div class="mbox mm" style="max-width:540px">
    <div class="mhdr">
      <h5 id="serviceModalTitle" style="color:var(--accent);margin:0;display:flex;align-items:center;gap:8px">
        <i class="bi bi-box-seam"></i> <span>Novo Serviço</span>
      </h5>
      <button class="btn-icon btn-sm" onclick="closeServiceModal()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="mbody" style="padding:16px 20px">
      <input type="hidden" id="servEditId">

      <div class="fld">
        <label class="flbl">Nome do Serviço *</label>
        <input type="text" class="inp" id="servName" placeholder="Ex: Render 3D Fachada, Planta Humanizada…" required>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="fld">
          <label class="flbl">Categoria</label>
          <input type="text" class="inp inp-sm" id="servCategory" placeholder="Ex: 3D, Projeto, Consultoria…" list="categorySuggestions">
          <datalist id="categorySuggestions">
            <option value="Modelagem & Render 3D">
            <option value="Plantas Humanizadas">
            <option value="Projeto Arquitetônico">
            <option value="Projeto de Interiores">
            <option value="Detalhamento Executivo">
            <option value="Consultoria">
            <option value="Outros">
          </datalist>
        </div>
        <div class="fld">
          <label class="flbl">Preço Padrão (R$)</label>
          <input type="text" class="inp inp-sm" id="servPrice" placeholder="0,00" oninput="formatCurrencyInput(this)">
        </div>
      </div>

      <div class="fld">
        <label class="flbl">Descrição / Escopo do Serviço</label>
        <textarea class="inp" id="servDesc" rows="3" placeholder="Detalhes do que está incluso neste serviço (ex: resolução 4k, revisões, etc.)" style="resize:vertical;font-size:12.5px"></textarea>
      </div>

      <!-- ASSOCIAÇÃO COM CLIENTES -->
      <div class="fld" style="margin-top:14px;padding:12px;background:var(--surface2);border-radius:10px;border:1px solid var(--border)">
        <label class="flbl" style="margin-bottom:8px;font-weight:700">Associação com Clientes</label>
        
        <div style="display:flex;flex-direction:column;gap:8px">
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
            <input type="radio" name="servTargetType" id="servTargetAll" value="all" checked onchange="toggleServClientPicker()">
            <span><strong>🌐 Geral</strong> — Disponível para todos os clientes e orçamentos</span>
          </label>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
            <input type="radio" name="servTargetType" id="servTargetSelected" value="selected" onchange="toggleServClientPicker()">
            <span><strong>🎯 Específico</strong> — Associado a cliente(s) selecionado(s)</span>
          </label>
        </div>

        <!-- Seletor de Clientes Específicos (Aparece se marcado 'selected') -->
        <div id="servClientsPickerWrap" style="display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span style="font-size:11.5px;color:var(--text2);font-weight:600">Selecione os clientes associados:</span>
            <input type="text" class="inp inp-sm" id="servClientSearch" placeholder="Filtrar cliente…" style="padding:2px 8px;font-size:11px;width:130px" oninput="filterServClientList()">
          </div>
          <div id="servClientsCheckboxList" style="max-height:160px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px">
            <!-- Renderizado dinamicamente via JS -->
          </div>
        </div>
      </div>
    </div>

    <div class="mftr" style="display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--border)">
      <button class="btn btn-ghost btn-sm" onclick="closeServiceModal()">Cancelar</button>
      <button class="btn btn-primary btn-sm" onclick="saveService()"><i class="bi bi-check2"></i> Salvar Serviço</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="common.js?v=145"></script>
<script src="servicos.js?v=109"></script>
</body>
</html>
